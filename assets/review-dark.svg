<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="How the work gets reviewed. The same diff is read twice. The first pass is a handoff audit: a fresh session with no memory of the build, told to break the work. The second is a cross-vendor review: the same diff through a different vendor's model. Each pass marks the lines it flagged, on its own side of the diff, and the two disagree.">
<style>
  .sw{opacity:0}
  .s1{animation:s1 10s cubic-bezier(.45,0,.55,1) infinite}
  .s2{animation:s2 10s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes s1{0%{transform:translateY(0);opacity:0}2%{opacity:1}33%{transform:translateY(170px);opacity:1}36%,100%{transform:translateY(170px);opacity:0}}
  @keyframes s2{0%,40%{transform:translateY(170px);opacity:0}42%{opacity:1}73%{transform:translateY(0);opacity:1}76%,100%{transform:translateY(0);opacity:0}}
  .mk{opacity:0}
  .mk0{animation:mk0 10s linear infinite}
  @keyframes mk0{0%,3.9%{opacity:0}5.4%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk1{animation:mk1 10s linear infinite}
  @keyframes mk1{0%,13.6%{opacity:0}15.1%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk2{animation:mk2 10s linear infinite}
  @keyframes mk2{0%,25.2%{opacity:0}26.7%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk3{animation:mk3 10s linear infinite}
  @keyframes mk3{0%,63.3%{opacity:0}64.8%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk4{animation:mk4 10s linear infinite}
  @keyframes mk4{0%,59.4%{opacity:0}60.9%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk5{animation:mk5 10s linear infinite}
  @keyframes mk5{0%,43.9%{opacity:0}45.4%{opacity:1}94%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.w,.r{stroke-dashoffset:0}.n,.mk{opacity:1}}</style>
<rect width="880" height="288" fill="#0d1117"/>

<text x="26" y="26" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#9198a1" letter-spacing=".13em">THE REVIEW STAGE / ONE DIFF / TWO INDEPENDENT PASSES</text>
