<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 442" width="400" height="442" role="img" aria-label="How the work gets reviewed. The same diff is read twice. The first pass is a handoff audit: a fresh session with no memory of the build, told to break the work. The second is a cross-vendor review: the same diff through a different vendor's model. Each pass marks the lines it flagged, on its own side of the diff, and the two disagree.">
<style>
  .sw{opacity:0}
