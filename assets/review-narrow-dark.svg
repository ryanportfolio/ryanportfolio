  .mk1{animation:mk1 10s linear infinite}
  @keyframes mk1{0%,13.6%{opacity:0}15.1%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk2{animation:mk2 10s linear infinite}
  @keyframes mk2{0%,25.2%{opacity:0}26.7%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk3{animation:mk3 10s linear infinite}
  @keyframes mk3{0%,63.3%{opacity:0}64.8%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk4{animation:mk4 10s linear infinite}
  @keyframes mk4{0%,59.4%{opacity:0}60.9%{opacity:1}94%{opacity:1}100%{opacity:0}}
  .mk5{animation:mk5 10s linear infinite}
  @keyframes mk5{0%,43.9%{opacity:0}45.4%{opacity:1}94%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.w,.r{stroke-dashoffset:0}.mk,.cw0{opacity:1}.cm0{opacity:1;stroke-dashoffset:0}}</style>
