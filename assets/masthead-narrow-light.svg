<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 301" width="400" height="301" role="img" aria-label="Ryan Allen. I build AI systems, developer tools, and one Steam game. All of it ships through a review pipeline I built. Pipeline: plan, agent build, adversarial review, ci gate, owner merge. 9 repositories scored, 1535 commits read, 334 merged pull requests.">
<style>
  .w{stroke-dasharray:400;stroke-dashoffset:400;animation:dr .8s cubic-bezier(.3,.8,.3,1) .15s both}
  .r{stroke-dasharray:400;stroke-dashoffset:400;animation:dr .9s cubic-bezier(.3,.8,.3,1) both}
  @keyframes dr{to{stroke-dashoffset:0}}
  .n{opacity:0;animation:fi .3s ease-out both}
  @keyframes fi{to{opacity:1}}
  .tk{opacity:0;animation:tk 9s cubic-bezier(.6,0,.4,1) 1.2s infinite}
  @keyframes tk{0%{transform:translateX(0.0px);opacity:0}4%{transform:translateX(0.0px);opacity:1}10%{transform:translateX(0.0px)}18%{transform:translateX(87.0px)}26%{transform:translateX(87.0px)}34%{transform:translateX(174.0px)}46%{transform:translateX(174.0px)}54%{transform:translateX(261.0px)}62%{transform:translateX(261.0px)}70%{transform:translateX(348.0px)}94%{transform:translateX(348.0px);opacity:1}100%{transform:translateX(348.0px);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.w,.r{stroke-dashoffset:0}.n,.mk{opacity:1}}</style>
<rect width="400" height="301" fill="#ffffff"/>

<text x="26" y="26" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#59636e" letter-spacing=".12em">DETERMINISTIC SCORER / NO MODEL IN THE PATH</text>
