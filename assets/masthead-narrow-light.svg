<text x="26" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">I build AI systems, developer tools,</text>
<text x="26" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">and one Steam game.</text>
<text x="26" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">All of it ships through a review</text>
<text x="26" y="167" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">pipeline I built.</text>
<text x="26" y="189" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="7.6" fill="#59636e" letter-spacing=".1em">EVERY CHANGE TAKES THIS PATH</text>
