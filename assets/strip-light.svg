<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 166" width="880" height="166" role="img" aria-label="Recorded review coverage scores zero out of one hundred on 8 of 9 repositories. The reviews run in separate sessions that leave no GitHub artifact, so the scorer cannot see them.">

<rect width="880" height="166" fill="#ffffff"/>

<text x="26" y="26" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9.5" fill="#59636e" letter-spacing=".13em">DETERMINISTIC AUDITOR / 9 REPOSITORIES / COLLECTED 2026-07-18</text>
<line x1="26" y1="38" x2="854" y2="38" stroke="#d1d9e0" stroke-width="1"/>
<text x="26" y="106" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="58" font-weight="600" fill="#bc4c00" letter-spacing="-.03em">0</text>
<text x="70" y="106" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#59636e">/100</text>
<text x="26" y="130" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9" fill="#1f2328" letter-spacing=".08em">RECORDED REVIEW COVERAGE</text>
<text x="26" y="144" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="9" fill="#59636e" letter-spacing=".08em">ON 8 OF 9 REPOSITORIES</text>
<line x1="266" y1="58" x2="266" y2="148" stroke="#d1d9e0" stroke-width="1"/>
<text x="300" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">The reviews happen. They run in separate zero-context sessions</text>
<text x="300" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#1f2328">told to falsify the work, and that leaves no GitHub artifact.</text>
<text x="300" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#59636e">The scorer counts only what GitHub records, so it scores this</text>
<text x="300" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="14.5" fill="#59636e">nothing. Weighting around it was the other option.</text>
