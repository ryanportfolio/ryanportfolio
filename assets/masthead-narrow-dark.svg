<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 268" width="400" height="268" role="img" aria-label="Ryan Allen. AI agents do the work, a human gates every merge. Pipeline: plan, agent build, adversarial review, CI gate, owner merge. 9 repositories scored, 1535 commits read, 334 merged pull requests.">
<style>
  .w{stroke-dasharray:400;stroke-dashoffset:400;animation:dr .8s cubic-bezier(.3,.8,.3,1) .15s both}
  .r{stroke-dasharray:400;stroke-dashoffset:400;animation:dr .9s cubic-bezier(.3,.8,.3,1) both}
  @keyframes dr{to{stroke-dashoffset:0}}
  .n{opacity:0;animation:fi .3s ease-out both}
  @keyframes fi{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="400" height="268" fill="#0d1117"/>

<text x="26" y="26" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="8" fill="#9198a1" letter-spacing=".12em">DETERMINISTIC SCORER / NO MODEL IN THE PATH</text>
<line class="r" x1="26" y1="38" x2="374" y2="38" stroke="#3d444d" stroke-width="1"/>
<text x="24" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" fill="#f0f6fc" letter-spacing="-.022em">Ryan Allen</text>
<text x="26" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">AI agents do the work.</text>
<text x="26" y="129" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9198a1">A human gates every merge.</text>
<text x="26" y="154" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="7.6" fill="#9198a1" letter-spacing=".1em">EVERY CHANGE TAKES THIS PATH</text>
