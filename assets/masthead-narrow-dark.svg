<text x="26" y="242" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#f0f6fc">9</text><text x="26" y="255" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="7.6" fill="#9198a1" letter-spacing=".1em">REPOS</text><text x="151" y="242" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#f0f6fc">1535</text><text x="151" y="255" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="7.6" fill="#9198a1" letter-spacing=".1em">COMMITS</text><text x="276" y="242" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#f0f6fc">334</text><text x="276" y="255" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="7.6" fill="#9198a1" letter-spacing=".1em">MERGED PRS</text>
